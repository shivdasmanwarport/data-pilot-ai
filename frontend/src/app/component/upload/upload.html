<div class="upload-container">
  <h2>Upload Dataset</h2>

  <input
    type="file"
    accept=".csv"
    (change)="onFileSelected($event)"
  />

  <button
    (click)="uploadFile()"
    [disabled]="!selectedFile"
  >
    Upload
  </button>

  <p *ngIf="message">
    {{ message }}
  </p>
</div>

<div *ngIf="columns.length > 0">

  <h3>Dataset Summary</h3>

  <p>
    Rows: {{ row_count }}
  </p>

  <p>
    Columns: {{ columns.length }}
  </p>

  <h4>Available Columns</h4>

  <ul>
    <li *ngFor="let col of columns">
      {{ col }}
    </li>
  </ul>

</div>

<h3>Ask Questions About Dataset</h3>

<input
  type="text"
  [(ngModel)]="question"
  placeholder="Ask a question"
/>

<button (click)="askQuestion()">
  Ask
</button>
<div *ngIf="answer">

  <h3>Answer</h3>

  <p>
    {{ answer }}
  </p>

</div>

<table *ngIf="preview.length > 0" border="1">

  <thead>
    <tr>
      <th *ngFor="let col of columns">
        {{ col }}
      </th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let row of preview">
      <td *ngFor="let col of columns">
        {{ row[col] }}
      </td>
    </tr>
  </tbody>

</table>
